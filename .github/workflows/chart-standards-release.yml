name: Chart standards checks
on:
  push:
    branches: [main]
    paths:
      - 'chart-math.js'
      - 'chart-views.js'
      - 'chart-standards.css'
      - 'tests/chart-math.cjs'
      - 'tests/charts-browser.py'
  pull_request:
    paths:
      - 'chart-math.js'
      - 'chart-views.js'
      - 'chart-standards.css'
      - 'tests/chart-math.cjs'
      - 'tests/charts-browser.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chart-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check chart calculations and source integrity
        run: |
          node --check chart-math.js
          node --check chart-views.js
          node --check growth.js
          node --check reflection-workflows.js
          node tests/chart-math.cjs
          python3 tests/validate-data.py
      - name: Install full Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps --no-shell chromium
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CHROMIUM_PATH='+p.chromium.executable_path+'\n')
          PY
      - name: Check charts, reflection workflows and mobile layout
        run: |
          python3 tests/charts-browser.py
          python3 tests/reflection-browser.py
          python3 tests/mobile-layout.py
      - name: Store reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-review-results
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
