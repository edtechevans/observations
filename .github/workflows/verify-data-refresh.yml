name: Verify October observation data merge

on:
  push:
    branches: [verified-data-refresh-20261013]
    paths: [.github/workflows/verify-data-refresh.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verified-data-refresh-20261013
          fetch-depth: 0
      - name: Merge verified October 9 onward records without changing earlier records
        shell: bash
        run: |
          python - <<'PY'
          EXPECTED = {"261009091541":"b026b3b08830860649688ce9a09765dcb3b7061bb0252b405407da12e9549b26","261009095125":"11f2610bc9577b77b4fb2e3fc58cc90a95012871b57caa6a4699ae1742a7e454","261009104623":"a63aff34abf3d60474abcb9e6da82ad5d2ef9a6bacf83e610cf6ee54e0dcec0b","261009103201":"89a7f724ed6157b5ddb2ab82d1b8d5661bca380b00b7909b8abefb92c5f5824d","261009104557":"a4d6cfdd740eb2942aa6a4486b251673f2ba2762d668062614c04071a660bed1","261009110713":"3996e4fbbcb8c96e62aaa979d05fece3c378d61f9e73746862ba8cdc4d4b3286","261009103230":"64ec8bd7559e2b010d89b9f196c10a3f6f9ee2b9cc93bf0782c88a12459501c1","261009110543":"cf5b3fa00840e0bfaca600b4270c720f2bba604ba31ecf3e64f8d94d491d09a6","261009103309":"52dec99dd6457cf2a12c540c8d72378471a374d66661e297a32c7d76843bcd4f","261009103251":"682c185acabc1de8980640234de9e05b8e47b8897550b5ab082b4a39f26d69dc","261009114411":"869e1479ee1d255ec8a835c9f7c264c2cc68daa58f1f2776e091697713562898","261009204847":"45425aa9717ccd761226559483c2e2b4efcbc40c86449d26ac2113f93a58fd66","261012115357":"77871faa187f529f370d5ba4a43b5d49044042c3639a4033024b20d66eca87e8","261012132140":"3f581284ec940b406673e28db605e465c7c1e8885254d3114b24995183dbb4d7","261012141812":"14573f38f0f91758f232dcd6aa9128987c3f300b8dc3dedc291bf145c11840fe","261012100455":"23bd665a5669a0ca7b867151167a89bb68c96a784290cfa9eb1a50ca9cedfe77","261012143715":"216f67ef1cf1030ca650d47b1ab4733f0ceac8ee22f930c4d9fa0265ee4e5102","261013075801":"120102fd25748d1fd9d3ddf35b33120f02b2ee101c6df76e4c96474c3ca2c18b","261013105126":"e364971fb1514d5def4cc8e5619b921a627c75cecf40c2bc619404ba19868319","261013105416":"074f1400791cd6e688b2cd8b28da73902ebd41aee86410f0714cb328528d7628","261013105551":"e202a4150dc3b4177b88cc1ea8c4f3e5d780e2811d44f65e126840b4d51e568e","261013105822":"39ff0af61b2ae9c384261556e134da02750f0947ddece484725ca04457393f76","261013110649":"cfd8ea02899f9eea4b03229fb69ee49a9d5cbf650badb1005ba7e4be77f2e69a"}
          RESPONSE = "Thank you for your feedback. We consistently begin our mornings by checking in with our feelings using the Zones of Regulation chart, which also provides opportunities for social-emotional conversations and helps us connect as a community.\nToday, I wanted to provide students with an opportunity to begin the day by collaborating with a partner and sharing their prior knowledge. During our UOI yesterday, we explored the Learner Profile attribute Knowledgeable, so this morning\u2019s activity was an intentional way to connect our previous learning with practice and encourage students to share what they know with others.\nI will continue to be mindful of how we can incorporate the different elements of Morning Meeting consistently while remaining responsive to our students\u2019 learning needs and making meaningful connections to our ongoing inquiries.\n"
          import csv, datetime as dt, hashlib, io, json, pathlib, re, subprocess
          FIELDS = ['ID','Date','Division','Observer','Observing','TimeOfClass','Notes','Star1','Guiding Question1','Commendation1','Star2','Guiding Question2','Commendation2','Commendation3','Wondering','Guiding Question3','Email','Response','__PowerAppsId__']
          CUTOFF = dt.date(2026,10,9)
          CSV = pathlib.Path('data/observations-full.csv')
          INDEX = pathlib.Path('index.html')
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def gitsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def date(row):
              return dt.datetime.strptime(row['Date'].strip(),'%m/%d/%Y').date()
          def canon(row):
              return json.dumps({k:row[k] for k in FIELDS},ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          def records(text):
              stream=io.StringIO(text,newline='')
              reader=csv.reader(stream,strict=True)
              header=next(reader)
              assert header==FIELDS
              end=stream.tell()
              prefix=text[:end]
              out=[]
              for cells in reader:
                  start,end=end,stream.tell()
                  assert len(cells)==len(FIELDS)
                  row=dict(zip(FIELDS,cells))
                  assert row['ID'] and date(row)
                  out.append((row,text[start:end]))
              assert len(out)==len({r['ID'] for r,raw in out})
              return prefix,out
          def serialize(row):
              output=io.StringIO(newline='')
              csv.writer(output,lineterminator='\n').writerow([row[k] for k in FIELDS])
              return output.getvalue()
          base=CSV.read_bytes()
          assert gitsha(base)=='86de04e5a6e800ac5400fe6d995da0793e30c18e','Historical source changed; stop'
          assert gitsha(INDEX.read_bytes())=='2162f45b5efbe8f78f42d7c4a3108235074b5e5a','Dashboard changed; stop'
          prefix,before=records(base.decode('utf-8'))
          assert len(before)==771
          delta=subprocess.check_output(['git','show','58677f89b7c9172f814df091d6a1c358516dbf78:data/observations-full.csv'])
          assert gitsha(delta)=='e7074f3a378d53023521f93c01547e8752db92ca'
          text=delta.decode('utf-8').encode('latin1').decode('cp1252')
          fix=str.maketrans({i:bytes([i]).decode('cp1252') for i in range(128,160) if i not in (129,141,143,144,157)})
          first=next(r for r,raw in before if r['ID']=='261009091541')
          first={k:v.translate(fix) for k,v in first.items()}
          first['Response']=RESPONSE
          incoming={first['ID']:first}
          skipped=[]
          for cells in csv.reader(io.StringIO(text,newline=''),strict=True):
              if not cells or not any(cells):
                  continue
              assert len(cells)==25 and not any(cells[19:])
              row=dict(zip(FIELDS,cells))
              if date(row)<CUTOFF:
                  skipped.append(row['ID'])
                  continue
              assert date(row)<=dt.date(2026,10,13)
              assert row['ID'] not in incoming
              incoming[row['ID']]=row
          assert set(incoming)==set(EXPECTED)
          for key,row in incoming.items():
              assert sha(canon(row))==EXPECTED[key],('Upload checksum mismatch',key)
          assert len(incoming)==23 and len(skipped)==3
          protected={r['ID']:raw for r,raw in before if date(r)<CUTOFF}
          parts=[prefix]
          seen=set()
          updated=[]
          for row,raw in before:
              key=row['ID']
              if key in incoming:
                  assert date(row)>=CUTOFF
                  parts.append(serialize(incoming[key]))
                  seen.add(key)
                  updated.append(key)
              else:
                  parts.append(raw)
          added=[]
          for key,row in incoming.items():
              if key not in seen:
                  if not parts[-1].endswith(('\n','\r')):
                      parts.append('\n')
                  parts.append(serialize(row))
                  added.append(key)
          merged=''.join(parts)
          new_prefix,after=records(merged)
          assert new_prefix==prefix
          assert protected=={r['ID']:raw for r,raw in after if date(r)<CUTOFF}
          assert len(after)==793 and len(added)==22 and updated==['261009091541']
          after_by_id={r['ID']:r for r,raw in after}
          assert {r['ID'] for r,raw in before}<=set(after_by_id)
          for key,value in EXPECTED.items():
              assert sha(canon(after_by_id[key]))==value
          rows=[r for r,raw in after if r['Observing'].strip() not in {'Silky Vyas','Santisha Sonilal'}]
          latest={}
          for r in rows:
              email=r['Email'].strip().lower()
              name=r['Observing'].strip()
              day=date(r)
              if email and name and (email not in latest or day>latest[email][0]):
                  latest[email]=(day,name)
          audit={}
          for r in rows:
              day=date(r)
              y=day.year if day.month>=8 else day.year-1
              year=f'{y}-{str(y+1)[-2:]}'
              a=audit.setdefault(year,dict(observations=0,faculty=set(),responses=0,elementary=0,secondary=0,beginning=0,middle=0,end=0,minDate=99999999,maxDate=0))
              a['observations']+=1
              a['faculty'].add(latest.get(r['Email'].strip().lower(),(None,r['Observing'].strip()))[1])
              a['responses']+=bool(r['Response'].strip())
              a['elementary']+='elementary' in r['Division'].strip().lower()
              a['secondary']+='secondary' in r['Division'].strip().lower()
              when=r['TimeOfClass'].strip().lower()
              if when in ('beginning','middle','end'):
                  a[when]+=1
              value=int(day.strftime('%Y%m%d'))
              a['minDate']=min(a['minDate'],value)
              a['maxDate']=max(a['maxDate'],value)
          for a in audit.values():
              a['faculty']=len(a['faculty'])
          html=INDEX.read_bytes().decode('utf-8')
          match=re.search(r'window\.OBS_PUBLIC_DATA=(\{[^\n]+\});',html)
          assert match
          old_audit=json.loads(match.group(1))
          assert audit['2025-26']==old_audit['audit']['2025-26']
          assert len(rows)==793 and audit['2026-27']['observations']==258
          meta={'audit':audit,'sourceRows':len(rows)}
          html,n=re.subn(r'window\.OBS_PUBLIC_DATA=\{[^\n]+\};','window.OBS_PUBLIC_DATA='+json.dumps(meta,separators=(',',':'))+';',html)
          assert n==1
          html,n=re.subn(r'(\./data/observations-full\.csv\?v=)[^\x27\x22\s]+',lambda m:m.group(1)+'20261013-verified-cutoff',html)
          assert n==1
          CSV.write_bytes(merged.encode('utf-8'))
          INDEX.write_bytes(html.encode('utf-8'))
          report={'cutoff_inclusive':'2026-10-09','data_through':'2026-10-13','source_rows':793,'added_rows':22,'updated_rows':1,'pre_cutoff_rows_preserved':len(protected),'pre_cutoff_byte_identical':True,'protected_sha256':sha(''.join(protected.values()).encode('utf-8')),'data_sha256':sha(CSV.read_bytes()),'index_sha256':sha(INDEX.read_bytes()),'data_git_sha':gitsha(CSV.read_bytes()),'index_git_sha':gitsha(INDEX.read_bytes()),'audit':audit,'verified_upload_sha256':EXPECTED}
          assert report['data_sha256']=='368f17ee2877ee278546da38f26b4979a185d1859b6c80c12e3b025dbb8a8b06'
          assert report['index_sha256']=='f8f764a443bd9c07bd08d1fb63cca8dde49a4f84051e9662a2e5b4f000699501'
          pathlib.Path('data/refresh-20261013.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          for i,script in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html)):
              if script.strip():
                  p=pathlib.Path(f'/tmp/observation-check-{i}.js')
                  p.write_text(script)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit verified files to the staging branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations-full.csv index.html data/refresh-20261013.json
          git commit -m "Verify 22 new observations and Sonia response; preserve 770 earlier records"
          git push origin HEAD:refs/heads/verified-data-refresh-20261013
