name: Validate Growth & Reflection
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: JavaScript and faculty goals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and matched source records
        run: |
          node --check growth.js
          node --check growth-people.js
          node --check ux-refresh.js
          node --check reflection-workflows.js
          python3 tests/validate-data.py
      - name: Check published dashboard assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          for asset in ('growth.js','growth.css','growth-people.js','growth-people.css','ux-refresh.js','ux-refresh.css','reflection-workflows.js','reflection-workflows.css'):
              assert ('./'+asset) in html and Path(asset).exists(), f'Missing {asset}'
          ux=Path('ux-refresh.js').read_text(encoding='utf-8')
          assert "label:'Classroom Observations'" in ux
          assert 'growthUnlockForm' not in html
          print('PASS: published assets and Classroom Observations navigation')
          PY
