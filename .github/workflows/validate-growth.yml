name: Validate Growth & Reflection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: JavaScript and faculty goals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check growth.js
          node --check growth-people.js
      - name: Audit public goal matching and UI assets
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          public=json.loads(Path('data/faculty-goals.json').read_text(encoding='utf-8'))
          summary=json.loads(Path('data/growth-summary.json').read_text(encoding='utf-8'))
          goals=public['rows']
          assert public['schoolYear']=='2026-27'
          assert len(goals)==54, f'Expected 54 eligible faculty, got {len(goals)}'
          emails=[g['email'].strip().lower() for g in goals]
          assert len(set(emails))==54, 'Duplicate faculty goals'
          assert all(g['division']=='Secondary' for g in goals)
          assert all(g['faculty'] and g['domain'] and g['facet'] and g['goal'] for g in goals)
          assert all('leadership' not in g['domain'].lower() for g in goals)
          with Path('data/observations-full.csv').open(encoding='utf-8-sig',newline='') as f:
              observed={
                  row['Email'].strip().lower()
                  for row in csv.DictReader(f)
                  if row['Email'].strip()
                  and len(parts:=row['Date'].split('/'))==3
                  and int(parts[2])==2026 and int(parts[0])>=8
              }
          assert set(emails)<=observed, 'Some goal records have no 2026-27 observation'
          byfacet=Counter(g['facet'] for g in goals)
          expected=summary['byDivision']['Secondary']['facetCounts']
          assert all(byfacet[k]==v for k,v in expected.items() if k in byfacet)
          assert summary['byDivision']['Elementary']['includedFaculty']==0
          assert summary['byDivision']['Secondary']['includedFaculty']==54
          html=Path('index.html').read_text(encoding='utf-8')
          for asset in ('growth.js','growth.css','growth-people.js','growth-people.css'):
              assert ('./'+asset) in html and Path(asset).exists(), f'Missing {asset}'
          assert 'growthUnlockForm' not in html, 'Old passphrase form still published'
          assert not Path('data/goals-secure.json').exists(), 'Obsolete encrypted vault still published'
          print('PASS: JavaScript syntax, 54 unique observed Secondary goals, facet totals and public dashboard assets')
          PY
