name: Build verified observation refresh

on:
  push:
    branches: [obs-refresh-20261014]
    paths: [.github/workflows/build-observation-refresh.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: obs-refresh-20261014
      - name: Merge source and reclassify Andrew Hamilton Other facets
        shell: bash
        env:
          PAYLOAD: [... ELLIPSIZATION ...]
        run: |
          python - <<'PY'
          import base64,csv,datetime as dt,hashlib,io,json,os,pathlib,re,zlib
          F=['ID','Date','Division','Observer','Observing','TimeOfClass','Notes','Star1','Guiding Question1','Commendation1','Star2','Guiding Question2','Commendation2','Commendation3','Wondering','Guiding Question3','Email','Response','__PowerAppsId__']
          CUTOFF=dt.datetime(2026,10,12)
          maps={
          '260811145154':('Wondering','Guiding Question3','Collaboration(Doing)','To what extent does collaborative learning enhance student learning and promote social well-being?'),
          '260811152649':('Star2','Guiding Question2','Creativity(Connecting)','In what ways does the learning environment support risk-taking?'),
          '260811154459':('Wondering','Guiding Question3','Agency(Being)','How might we ensure students have opportunities to reflect on their planning, thinking, work, and/or progress?'),
          '260812121753':('Wondering','Guiding Question3','Agency(Being)','To what extent do students take ownership of their learning process?'),
          '260817145325':('Wondering','Guiding Question3','Agency(Being)','How might we ensure students have opportunities to reflect on their planning, thinking, work, and/or progress?'),
          '260821133955':('Wondering','Guiding Question3','Authenticity(Connecting)','How do we help students generalize a mindset or strategy from one subject or setting to another?'),
          '260828115305':('Wondering','Guiding Question3','Agency(Being)','How might we ensure students have opportunities to reflect on their planning, thinking, work, and/or progress?'),
          '260828115556':('Wondering','Guiding Question3','Authenticity(Connecting)','How do we help students generalize a mindset or strategy from one subject or setting to another?'),
          '260914154416':('Wondering','Guiding Question3','Collaboration(Doing)','To what extent does collaborative learning enhance student learning and promote social well-being?'),
          '260915072451':('Wondering','Guiding Question3','Personalization(Being)',"To what extent are the  learning experiences personalized to meet student's individual needs and interests?"),
          '261008091733':('Wondering','Guiding Question3','Agency(Being)','To what extent do students take ownership of their learning process?')}
          def d(r): return dt.datetime.strptime(r['Date'].strip(),'%m/%d/%Y')
          def ser(r):
            s=io.StringIO(newline=''); csv.writer(s,lineterminator='\n').writerow([r.get(k,'') for k in F]); return s.getvalue()
          p=pathlib.Path('data/observations-full.csv'); text=p.read_text(encoding='utf-8')
          stream=io.StringIO(text,newline=''); rd=csv.reader(stream,strict=True); hdr=next(rd); assert hdr==F
          end=stream.tell(); prefix=text[:end]; current=[]
          for cells in rd:
            start,end=end,stream.tell()
            if not cells or not any(cells): continue
            assert len(cells)==19
            current.append((dict(zip(F,cells)),text[start:end]))
          assert len(current)==793
          incoming=json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD'])).decode('utf-8'))
          assert len(incoming)==29 and all(d(r)>=CUTOFF for r in incoming)
          new={r['ID']:r for r in incoming}; curids={r['ID'] for r,_ in current}
          protected={r['ID']:raw for r,raw in current if d(r)<CUTOFF and r['ID'] not in maps}
          parts=[prefix]; replaced=[]; changed=[]
          for row,raw in current:
            rid=row['ID']
            if rid in new:
              row=dict(new[rid]); replaced.append(rid)
            elif rid in maps:
              row=dict(row)
            else:
              parts.append(raw); continue
            if rid in maps:
              fk,qk,facet,q=maps[rid]
              assert row['Observer'].strip()=='Andrew Hamilton'
              assert row[fk].strip().startswith('Other')
              row[fk]=facet; row[qk]=q; changed.append(rid)
            parts.append(ser(row))
          added=[]
          for rid,row in new.items():
            if rid not in curids:
              if rid in maps:
                fk,qk,facet,q=maps[rid]; row=dict(row); row[fk]=facet; row[qk]=q
              parts.append(ser(row)); added.append(rid)
          merged=''.join(parts); p.write_text(merged,encoding='utf-8',newline='')
          with p.open('r',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==811 and len({r['ID'] for r in rows})==811
          by={r['ID']:r for r in rows}
          assert protected=={r['ID']:raw for r,raw in current if d(r)<CUTOFF and r['ID'] not in maps}
          assert len(replaced)==11 and len(added)==18 and len(changed)==11
          for rid,(fk,qk,facet,q) in maps.items():
            assert by[rid][fk]==facet and by[rid][qk]==q
          assert not any(r['Observer'].strip()=='Andrew Hamilton' and d(r)>=dt.datetime(2026,7,1) and any(r[k].strip().startswith('Other') for k in ['Star1','Star2','Wondering']) for r in rows)
          audit={}
          for r in rows:
            day=d(r); y=day.year if day.month>=8 else day.year-1; yr=f'{y}-{str(y+1)[-2:]}'
            a=audit.setdefault(yr,{'observations':0,'faculty':set(),'responses':0,'elementary':0,'secondary':0,'beginning':0,'middle':0,'end':0,'minDate':99999999,'maxDate':0})
            a['observations']+=1; a['faculty'].add(r['Observing'].strip()); a['responses']+=bool(r['Response'].strip())
            div=r['Division'].lower(); a['elementary']+='elementary' in div; a['secondary']+='secondary' in div
            w=r['TimeOfClass'].strip().lower()
            if w in ('beginning','middle','end'): a[w]+=1
            n=int(day.strftime('%Y%m%d')); a['minDate']=min(a['minDate'],n); a['maxDate']=max(a['maxDate'],n)
          for a in audit.values(): a['faculty']=len(a['faculty'])
          idx=pathlib.Path('index.html'); html=idx.read_text(encoding='utf-8')
          html,n=re.subn(r'window\.OBS_PUBLIC_DATA=\{[^\n]+\};','window.OBS_PUBLIC_DATA='+json.dumps({'audit':audit,'sourceRows':len(rows)},separators=(',',':'))+';',html); assert n==1
          html,n=re.subn(r'(\./data/observations-full\.csv\?v=)[^\x27\x22\s]+',lambda m:m.group(1)+'20261014-oct12-andrew',html); assert n==1
          idx.write_text(html,encoding='utf-8',newline='')
          report={'data_through':'2026-10-13','cutoff':'2026-10-12','rows':811,'replaced_oct12_plus':len(replaced),'added_oct12_plus':len(added),'andrew_reclassified':changed,'audit':audit,'data_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('data/refresh-20261014.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit verified refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations-full.csv data/refresh-20261014.json index.html
          git commit -m "Refresh observations from Oct 12 and reclassify Andrew Hamilton Other facets"
          git push origin HEAD:obs-refresh-20261014
