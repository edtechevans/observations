name: Reflection browser checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reflection-release-check.yml'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'tests/**'
  pull_request:
permissions:
  contents: read
concurrency:
  group: reflection-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and original records
        run: |
          node --check reflection-workflows.js
          node --check growth.js
          node --check growth-people.js
          node --check ux-refresh.js
          python3 tests/validate-data.py
      - name: Install full Chromium for browser tests
        run: |
          python3 -m pip install playwright==1.64.0
          python3 -m playwright install --with-deps --no-shell chromium
      - name: Run representative leader workflows and mobile layout
        run: |
          export CHROMIUM_PATH="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python3 tests/reflection-browser.py
          python3 tests/mobile-layout.py
      - name: Store browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-browser-results
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
